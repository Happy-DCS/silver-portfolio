<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Silver Eun Cho</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--ink:#1e1b16;--green:#2f7d43;--muted:#8b857a;--line:#e4dfd5;
  --serif-kr:'Nanum Myeongjo',serif;--serif-en:'Instrument Serif',serif;
  --sans:'Pretendard Variable',Pretendard,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-gutter:stable}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.container{max-width:1440px;margin:0 auto;padding:0 50px;width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:#fff}

header{position:fixed;top:22px;left:0;right:0;z-index:100;display:flex;justify-content:center;padding:0 50px;pointer-events:none}
header::before{
  content:"";position:fixed;top:0;left:0;right:0;height:150px;z-index:-1;
  background:linear-gradient(to bottom,#fff 0%,#fff 60%,rgba(255,255,255,0) 100%);
  pointer-events:none;
}
.hd{
  pointer-events:auto;width:100%;max-width:1340px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;padding:0 14px 0 32px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:100px;
}
.logo{display:flex;align-items:baseline;gap:.26em;font-size:19px;color:var(--ink)}
.logo em{font-family:var(--serif-en);font-style:italic;font-weight:400;font-size:1.18em}
.logo b{font-family:var(--sans);font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:8px;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase}
nav a{padding:9px 18px;border-radius:100px;color:var(--ink);transition:background-color .25s ease,color .25s ease}
nav a:hover,nav a.on{background:var(--ink);color:#fff}

/* ---------- contact (타이포 스택형) ---------- */
main{
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:72px 0 0;
}
.c-label{font-size:clamp(54px,7.4vw,118px);line-height:1.08;letter-spacing:-.03em}
.c-label b{font-family:var(--sans);font-weight:800;text-transform:uppercase}
.c-label em{font-family:var(--serif-en);font-style:italic;font-weight:400;letter-spacing:0}
/* GET IN touch 호버 스왑 (히어로 오마주) */
.line1{display:inline-grid;cursor:pointer}
.line1>span{grid-area:1/1;justify-self:center;white-space:nowrap;transition:opacity .4s ease,transform .4s ease}
.line1 .l-kr{
  font-family:var(--serif-kr);font-weight:800;letter-spacing:.02em;
  font-size:.89em;align-self:center;
  color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  opacity:0;transform:translateY(20px);
}
.line1:hover .l-en{opacity:0;transform:translateY(-20px)}
.line1:hover .l-kr{opacity:1;transform:none}
.line1 .l-kr .oj{color:var(--ink);-webkit-text-stroke:0}
.mail{
  font-family:var(--serif-en);
  font-size:clamp(54px,7.4vw,118px);line-height:1.08;
  text-decoration:none;
  -webkit-text-stroke:0 var(--ink);
  transition:-webkit-text-stroke .25s ease;
}
.mail:hover{
  text-decoration:underline;text-underline-offset:.1em;text-decoration-thickness:.035em;
  -webkit-text-stroke:.022em var(--ink);
}
.c-sns{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.45em;
  font-size:clamp(54px,7.4vw,118px);line-height:1.08;
}
.c-sns a{transition:color .3s ease}
/* 인스타그램: 세리프 이탤릭 + 브랜드 그라데이션 + 아이콘 등장 (클로버와 동일 문법) */
.c-sns .ig{font-family:var(--serif-en);font-style:italic}
.c-sns .ig:hover{
  background:linear-gradient(45deg,#405de6,#833ab4,#c13584,#e1306c,#fd1d1d,#f77737,#fcaf45);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.igc{
  display:inline-block;width:0;height:.72em;vertical-align:-.02em;
  transition:width .45s cubic-bezier(.65,0,.25,1),margin .45s cubic-bezier(.65,0,.25,1);
}
.igc img{
  width:100%;height:100%;display:block;object-fit:contain;
  opacity:0;transform:scale(.5);
  transition:opacity .3s ease .1s,transform .4s cubic-bezier(.34,1.56,.64,1) .1s;
}
.c-sns a:hover .igc{width:.78em;margin-left:.12em}
.c-sns a:hover .igc img{opacity:1;transform:scale(1)}
/* 비헨스·링크드인: 산세리프 + 브랜드 컬러 */
.c-sns .be,.c-sns .li{font-family:var(--sans);font-weight:700;letter-spacing:-.02em}
.c-sns .be:hover{color:#1769ff}
.c-sns .li:hover{color:#0a66c2}
/* Resume: 호버 시 검은 상자 + 이력서로 스왑 (영문 세리프 ↔ 한글 산세리프) */
.c-sns .rs{display:inline-grid;padding:0 .14em;cursor:pointer;transition:background-color .3s ease}
.rs>span{grid-area:1/1;justify-self:center;transition:opacity .3s ease}
.rs .r-en{font-family:var(--serif-en)}
.rs .r-kr{
  font-family:var(--sans);font-weight:700;letter-spacing:0;
  font-size:.82em;align-self:center;
  color:#fff;opacity:0;
}
.rs:hover{background:var(--ink)}
.rs:hover .r-en{opacity:0}
.rs:hover .r-kr{opacity:1}
.c-sns .s-serif{font-family:var(--serif-en)}
.c-sns .s-bold{font-family:var(--sans);font-weight:700}

</style>
</head>
<body>

<header>
  <div class="hd">
    <a class="logo" href="index.html"><em>Silver</em><b>EUN CHO</b></a>
    <nav>
      <a href="works.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="on">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <p class="c-label"><span class="line1"><span class="l-en"><b>GET IN</b> <em>touch</em></span><span class="l-kr">편하게 연락해 주세요</span></span></p>
    <a class="mail" href="mailto:euncho.work@gmail.com">euncho.work@gmail.com</a>
    <div class="c-sns">
      <a class="ig" href="#" target="_blank" rel="noopener">Instagram<span class="igc"><img src="assets/img/instagram.png" alt=""></span></a>
      <a class="be" href="#" target="_blank" rel="noopener">Behance<span class="igc"><img src="assets/img/behance.png" alt=""></span></a>
      <a class="li" href="#" target="_blank" rel="noopener">LinkedIn<span class="igc"><img src="assets/img/linkedin.png" alt=""></span></a>
      <a class="rs" href="#"><span class="r-en">Resume</span><span class="r-kr">이력서</span></a>
    </div>
  </div>
</main>

</body>
</html>
