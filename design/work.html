<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — Silver Eun Cho</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--ink:#1e1b16;--green:#2f7d43;--muted:#8b857a;--line:#e4dfd5;
  --serif-kr:'Nanum Myeongjo',serif;--serif-en:'Instrument Serif',serif;
  --sans:'Pretendard Variable',Pretendard,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.container{max-width:1440px;margin:0 auto;padding:0 50px}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:#fff}

header{position:fixed;top:22px;left:0;right:0;z-index:100;display:flex;justify-content:center;padding:0 50px;pointer-events:none}
header::before{
  content:"";position:fixed;top:0;left:0;right:0;height:150px;z-index:-1;
  background:linear-gradient(to bottom,#fff 0%,#fff 60%,rgba(255,255,255,0) 100%);
  pointer-events:none;
}
.hd{
  pointer-events:auto;width:100%;max-width:1340px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;padding:0 14px 0 32px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:100px;
}
.logo{display:flex;align-items:baseline;gap:.26em;font-size:19px;color:var(--ink)}
.logo em{font-family:var(--serif-en);font-style:italic;font-weight:400;font-size:1.18em}
.logo b{font-family:var(--sans);font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:8px;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase}
nav a{padding:9px 18px;border-radius:100px;color:var(--ink);transition:background-color .25s ease,color .25s ease}
nav a:hover,nav a.on{background:var(--ink);color:#fff}

/* ---------- 작품 헤드 ---------- */
.wk-head{padding:190px 0 56px}
.wk-back{
  display:inline-block;font-size:13px;letter-spacing:.1em;color:var(--muted);
  margin-bottom:36px;transition:color .25s ease;text-transform:uppercase;
}
.wk-back:hover{color:var(--ink)}
.wk-head h1{
  font-family:var(--serif-kr);font-weight:800;
  font-size:clamp(40px,5vw,76px);line-height:1.2;letter-spacing:-.02em;
}
.wk-head .en{
  font-family:var(--serif-en);font-style:italic;font-weight:400;
  font-size:clamp(22px,2.2vw,34px);color:var(--muted);margin-top:10px;display:block;
}
.wk-meta{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:34px;
  font-size:13.5px;letter-spacing:.04em;
}
.wk-meta span{border:1px solid var(--line);border-radius:100px;padding:8px 18px;color:var(--ink)}

/* ---------- PDF 뷰어 ---------- */
.wk-view{padding-bottom:60px}
#pdfPages{display:flex;flex-direction:column;gap:0}
#pdfPages canvas{width:100%;height:auto;display:block}
#pdfEmbed{width:100%;height:88vh;border:1px solid var(--line)}
#pdfEmpty{
  display:none;border:1px dashed var(--line);
  padding:130px 40px;text-align:center;color:var(--muted);font-size:15px;line-height:2;
}
#pdfEmpty b{color:var(--ink);font-weight:600}

/* ---------- 이전/다음 ---------- */
.wk-nav{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  border-top:1px solid var(--ink);padding:36px 0 130px;
}
.wk-nav a{transition:color .25s ease}
.wk-nav .dir{font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px}
.wk-nav .ttl{font-family:var(--serif-kr);font-weight:700;font-size:20px}
.wk-nav a:hover .ttl{text-decoration:underline;text-underline-offset:4px}
.wk-nav .nx{text-align:right}
.wk-nav .all{
  font-size:13px;letter-spacing:.08em;border:1px solid var(--line);
  border-radius:100px;padding:10px 22px;text-transform:uppercase;
  transition:background-color .25s ease,color .25s ease,border-color .25s ease;
}
.wk-nav .all:hover{background:var(--ink);border-color:var(--ink);color:#fff}

footer{background:var(--ink);color:#f4f1ea;padding:90px 0 40px}
.ft-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:80px}
.ft-cta{font-family:var(--sans);font-weight:800;font-size:clamp(40px,5vw,72px);line-height:1.04;letter-spacing:-.02em;text-transform:uppercase}
.ft-cta em{font-family:var(--serif-en);font-style:italic;font-weight:400;text-transform:none}
.fl{display:inline-grid;cursor:pointer}
.fl>span{grid-area:1/1;justify-self:start;white-space:nowrap;transition:opacity .4s ease,transform .4s ease}
.fl .f-kr{
  font-family:var(--sans);font-weight:800;letter-spacing:.02em;
  font-size:.89em;align-self:center;color:#f4f1ea;
  opacity:0;transform:translateY(20px);
}
.fl:hover .f-en{opacity:0;transform:translateY(-20px)}
.fl:hover .f-kr{opacity:1;transform:none}
.ft-mailbtn{
  flex:none;display:inline-flex;align-items:center;gap:12px;
  font-size:15px;letter-spacing:.04em;
  border:1px solid #f4f1ea;border-radius:100px;padding:16px 30px;
  transition:background-color .3s ease,color .3s ease;
}
.ft-mailbtn:hover{background:#f4f1ea;color:var(--ink)}
.ft-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #3a352d;padding-top:26px;font-size:12.5px;color:#8f8a80;letter-spacing:.06em}
.ft-bottom .sns{display:flex;gap:26px}
.ft-bottom a:hover{color:#fff}

/* TOP 버튼 */
.top-btn{
  position:fixed;right:28px;bottom:28px;z-index:90;
  width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border:1px solid var(--line);
  font-family:var(--sans);font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease,background-color .25s ease,color .25s ease,border-color .25s ease;
}
.top-btn.show{opacity:1;transform:none;pointer-events:auto}
.top-btn:hover{background:var(--ink);border-color:var(--ink);color:#fff}
</style>
</head>
<body>

<header>
  <div class="hd">
    <a class="logo" href="index.html"><em>Silver</em><b>EUN CHO</b></a>
    <nav>
      <a href="works.html" class="on">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<div class="container wk-head">
  <a class="wk-back" href="works.html">← All Works</a>
  <h1 id="wkTitle">작품 제목</h1>
  <span class="en" id="wkEn">Project Title</span>
  <div class="wk-meta" id="wkMeta"></div>
</div>

<div class="container wk-view">
  <div id="pdfPages"></div>
  <div id="pdfEmpty">
    <b>이 작품의 PDF가 아직 업로드되지 않았습니다.</b><br>
    <span id="pdfHint"></span>
  </div>
</div>

<div class="container wk-nav">
  <a id="prevA" href="#"><span class="dir">← Prev</span><span class="ttl" id="prevT"></span></a>
  <a class="all" href="works.html">All Works</a>
  <a class="nx" id="nextA" href="#"><span class="dir">Next →</span><span class="ttl" id="nextT"></span></a>
</div>

<footer>
  <div class="container">
    <div class="ft-head">
      <h2 class="ft-cta"><span class="fl"><span class="f-en">LET'S CREATE <em>together</em></span><span class="f-kr">함께 만들어가요</span></span></h2>
      <a class="ft-mailbtn" href="mailto:euncho.work@gmail.com">euncho.work@gmail.com ↗</a>
    </div>
    <div class="ft-bottom">
      <span>© 2026 Silver Eun Cho. All rights reserved.</span>
      <span class="sns"><a href="#">Instagram</a><a href="#">Behance</a><a href="#">LinkedIn</a></span>
    </div>
  </div>
</footer>

<button class="top-btn" id="topBtn" aria-label="맨 위로">TOP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ---------- 작품 데이터 (PDF는 assets/pdf/workN.pdf 로 저장) ----------
const works={
  1:{kr:'까치커피바',en:'GGACHI COFFEE BAR',cat:'Branding · Web',yr:'2026'},
  2:{kr:'데미안 리커버',en:'Demian, Re-covered',cat:'Book Design',yr:'2025'},
  3:{kr:'행운 채집 展',en:'Luck Foraging',cat:'Poster · Graphic',yr:'2025'},
  4:{kr:'밑줄',en:'Mitjul — Reading Log App',cat:'UI/UX',yr:'2024'},
  5:{kr:'클로버 오브제',en:'CLOVER OBJET',cat:'Product',yr:'2024'},
  6:{kr:'SPROUT 전시 아이덴티티',en:'SPROUT Exhibition',cat:'Branding',yr:'2024'},
  7:{kr:'행복한 풀 (동화책)',en:'The Lucky Grass — Picture Book',cat:'Book · Illustration',yr:'2025'},
  8:{kr:'행복한 풀 (애니메이션)',en:'The Lucky Grass — Animated',cat:'Motion · Animation',yr:'2025'},
  9:{kr:'타이포 포스터 연작',en:'Typo Poster Series',cat:'Poster · Type',yr:'2023'},
  10:{kr:'키오스크 리디자인',en:'Campus Kiosk Redesign',cat:'UI/UX',yr:'2023'},
  11:{kr:'키네틱 타이포 루프',en:'Kinetic Type Loop',cat:'Motion',yr:'2023'},
  12:{kr:'동네 마켓 포스터',en:'Local Market Identity Poster',cat:'Graphic',yr:'2023'}
};

const p=parseInt(new URLSearchParams(location.search).get('p'))||1;
const w=works[p]||works[1];
const pdfPath=`assets/pdf/work${p}.pdf`;

// 헤드 채우기
document.title=`${w.kr} — Silver Eun Cho`;
document.getElementById('wkTitle').textContent=w.kr;
document.getElementById('wkEn').textContent=w.en;
document.getElementById('wkMeta').innerHTML=`<span>${w.yr}</span><span>${w.cat}</span>`;
document.getElementById('pdfHint').textContent=`홈페이지 폴더에 work${p}.pdf 로 넣어주시면 이 자리에 표시됩니다.`;

// 이전/다음
const keys=Object.keys(works).map(Number);
const prev=keys.includes(p-1)?p-1:keys[keys.length-1];
const next=keys.includes(p+1)?p+1:keys[0];
document.getElementById('prevA').href=`work.html?p=${prev}`;
document.getElementById('prevT').textContent=works[prev].kr;
document.getElementById('nextA').href=`work.html?p=${next}`;
document.getElementById('nextT').textContent=works[next].kr;

// ---------- PDF 표시 ----------
const pagesBox=document.getElementById('pdfPages'),empty=document.getElementById('pdfEmpty');
function showEmpty(){empty.style.display='block'}

if(location.protocol==='file:'){
  // 로컬 미리보기: 브라우저 내장 뷰어 사용
  const ob=document.createElement('object');
  ob.data=pdfPath+'#toolbar=0&navpanes=0';
  ob.type='application/pdf';
  ob.id='pdfEmbed';
  ob.innerHTML='';
  pagesBox.appendChild(ob);
  // 파일이 없으면 내장 뷰어가 비어 보이므로 안내도 함께 표시
  fetch(pdfPath,{method:'HEAD'}).catch(()=>{});
}else if(window.pdfjsLib){
  // 배포/서버 환경: pdf.js로 페이지를 이미지처럼 이어 렌더링
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument(pdfPath).promise.then(async pdf=>{
    const cw=pagesBox.clientWidth,dpr=Math.min(2,devicePixelRatio||1);
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const v0=page.getViewport({scale:1});
      const scale=cw/v0.width;
      const vp=page.getViewport({scale:scale*dpr});
      const c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;
      pagesBox.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }).catch(showEmpty);
}else{showEmpty()}

// TOP 버튼
const tb=document.getElementById('topBtn');
addEventListener('scroll',()=>tb.classList.toggle('show',scrollY>400),{passive:true});
tb.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
